services:
  classifier:
    build: ./scenario_1_classification
    ports:
      - "8001:8000"
    volumes:
      - classifier_artifacts:/app/artifacts
    restart: "no"
  chatbot:
    build: ./scenario_2_chatbot
    ports:
      - "8002:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_with_your_api_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      RETRIEVAL_TOP_K: "10"
      CONTEXT_TOP_K: "4"
      MIN_RERANK_SCORE: "0.0"
    volumes:
      - chatbot_index:/app/index
      - model_cache:/root/.cache/huggingface
    restart: "no"
volumes:
  classifier_artifacts:
  chatbot_index:
  model_cache:
